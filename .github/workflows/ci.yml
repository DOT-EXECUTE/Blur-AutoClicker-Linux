name: CI

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + type check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run frontend:build

  rust:
    name: Rust (fmt + check + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check
        id: cargo-check
        working-directory: src-tauri
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --target x86_64-unknown-linux-gnu --locked 2>&1 | tee /tmp/cargo-check.log

      - name: Post Check error as commit comment
        if: steps.cargo-check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = `### CI cargo check failure\n\n\`\`\`\n${fs.readFileSync('/tmp/cargo-check.log', 'utf8').slice(-6000)}\n\`\`\``;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

      - name: Fail if Check failed
        if: steps.cargo-check.outcome == 'failure'
        run: exit 1

      - name: Test
        id: cargo-test
        working-directory: src-tauri
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --target x86_64-unknown-linux-gnu --locked 2>&1 | tee /tmp/cargo-test.log

      - name: Post Test error as commit comment
        if: steps.cargo-test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = `### CI cargo test failure\n\n\`\`\`\n${fs.readFileSync('/tmp/cargo-test.log', 'utf8').slice(-6000)}\n\`\`\``;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

      - name: Fail if Test failed
        if: steps.cargo-test.outcome == 'failure'
        run: exit 1
