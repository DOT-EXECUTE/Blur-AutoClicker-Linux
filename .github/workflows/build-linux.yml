name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to release (create a draft release with the version tag)'
        required: false
        default: false
        type: boolean
  push:
    branches: [linux]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64 packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            dpkg \
            rpm

      - name: Install npm dependencies
        run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Linux packages
        id: build-packages
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/build-packages.sh 2>&1 | tee /tmp/build-packages.log

      - name: Post build error as commit comment
        if: steps.build-packages.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = `### CI build packages failure\n\n\`\`\`\n${fs.readFileSync('/tmp/build-packages.log', 'utf8').slice(-6000)}\n\`\`\``;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

      - name: Fail if build failed
        if: steps.build-packages.outcome == 'failure'
        run: exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blur-autoclicker-linux-x86_64
          path: packages/*
          if-no-files-found: error
